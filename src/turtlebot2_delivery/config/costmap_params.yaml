# costmap_params.yaml
# ====================
# Costmap configuration for TurtleBot2 with Kinect sensor.
#
# The Kinect depth image is converted to a /scan LaserScan by the
# depthimage_to_laserscan nodelet inside 3dsensor.launch.
# The scan TF frame is "camera_depth_frame" (set in 3dsensor.launch).

# ── Robot footprint ──────────────────────────────────────────────────
# Kobuki base radius ~0.18 m + 0.05 m safety margin = 0.23 m.
robot_radius: 0.18

# ── Global costmap ───────────────────────────────────────────────────
# Operates on the static map loaded by map_server.
# Used by NavfnROS to plan a collision-free global path.
global_costmap:
  global_frame:     map
  robot_base_frame: base_footprint
  update_frequency:  1.0
  publish_frequency: 0.5
  static_map: true
  transform_tolerance: 3.0

  inflation_radius:    0.18
  cost_scaling_factor: 1.0

  plugins:
    - {name: static_layer,    type: "costmap_2d::StaticLayer"}
    - {name: obstacle_layer,  type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

  obstacle_layer:
    observation_sources: kinect_scan
    kinect_scan:
      sensor_frame:        camera_depth_frame
      data_type:           LaserScan
      topic:               /scan
      marking:             true
      clearing:            true
      min_obstacle_height: 0.0
      max_obstacle_height: 2.0
      obstacle_range:      3.5
      raytrace_range:      4.0

# ── Local costmap ────────────────────────────────────────────────────
# Rolling window around the robot. Updated by the live /scan stream.
# Used by DWAPlannerROS to avoid obstacles in real time.
local_costmap:
  global_frame:     odom
  robot_base_frame: base_footprint
  update_frequency:  5.0
  publish_frequency: 2.0
  static_map: false
  rolling_window: true
  transform_tolerance: 3.0
  width:      3.0      # metres
  height:     3.0
  resolution: 0.05     # metres per cell

  inflation_radius:    0.12
  cost_scaling_factor: 1.0

  plugins:
    - {name: obstacle_layer,  type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

  obstacle_layer:
    observation_sources: kinect_scan
    kinect_scan:
      # "camera_depth_frame" is the output_frame_id set by depthimage_to_laserscan
      # inside turtlebot_bringup/3dsensor.launch (scan_processing group).
      sensor_frame: camera_depth_frame
      data_type:    LaserScan
      topic:        /scan
      marking:      true
      clearing:     true
      min_obstacle_height: 0.0
      max_obstacle_height: 2.0
      obstacle_range:  4.0   # match Kinect max range
      raytrace_range:  4.5
